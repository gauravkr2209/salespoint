<!doctype html>
<html lang="en" class="dark" style="background-color: #0E0B1D; color: #C9C2E3;">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0E0B1D" />
		<script>
			// Inline theme initializer — always defaulting to premium dark purple theme
			(function() {
				try {
					var stored = localStorage.getItem('salespoint_theme');
					if (stored === 'light') {
						document.documentElement.classList.remove('dark');
					} else {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-midnight text-pale-lavender selection:bg-royal-purple selection:text-white" style="background-color: #0E0B1D; color: #C9C2E3;">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
